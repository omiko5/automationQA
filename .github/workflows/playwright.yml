name: Playwright Tests (Docker)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Build Docker image
      - name: Build Docker image
        run: docker build -t playwright-tests .

      # Run tests in container (create named container)
      - name: Run tests in Docker
        run: docker run --name playwright-run playwright-tests

      # Copy Playwright report out of container
      - name: Extract Playwright report
        if: always()
        run: docker cp playwright-run:/app/playwright-report ./playwright-report || true

      # Copy test results (optional but recommended if enabled)
      - name: Extract test results (if any)
        if: always()
        run: docker cp playwright-run:/app/test-results ./test-results || true

      # Cleanup container
      - name: Remove container
        if: always()
        run: docker rm playwright-run || true

      # Upload report
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      # Upload traces/videos if enabled
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/